<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Menu</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

    <retro-game-menu></retro-game-menu>

    <script>
        class RetroGameMenu extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.currentIndex = 0;
                this.games = [
                    { id: 1, title: "Não sou um robô", desc: "Resolva CAPTCHAs absurdos para provar que você é humano.", url: "https://neal.fun/not-a-robot/" },
                    { id: 2, title: "Simulador de clique", desc: "Clique, acumule pontos e afunde no caos do excesso digital.", url: "https://neal.fun/stimulation-clicker/" },
                    { id: 3, title: "Artefatos da internet", desc: "Explore relíquias históricas que moldaram a internet como a conhecemos.", url: "https://neal.fun/internet-artifacts/" },
                    { id: 4, title: "Jogo da senha", desc: "Crie uma senha impossível que obedece a regras cada vez mais absurdas.", url: "https://neal.fun/password-game/" },
                    { id: 5, title: "Troca de janelas", desc: "Veja em tempo real a vista da janela de alguém no mundo inteiro.", url: "https://www.window-swap.com/Window" },
                    { id: 6, title: "Círculo perfeito", desc: "Desenhe o círculo mais perfeito que conseguir com o mouse.", url: "https://neal.fun/perfect-circle/" },
                    { id: 7, title: "Gaste o dinheiro do Bill Gates", desc: "Compre itens reais até zerar a fortuna bilionária de Bill Gates.", url: "https://neal.fun/spend/" },
                    { id: 8, title: "Quem estava vivo", desc: "Descubra os famosos que viveram ao mesmo tempo no mundo.", url: "https://neal.fun/who-was-alive/" },
                    { id: 9, title: "Estatísticas da vida", desc: "Veja números sobre o que aconteceu desde que você nasceu.", url: "https://neal.fun/life-stats/" }
                ];
            }

            connectedCallback() {
                this.render();
                this.setupEventListeners();
            }

            render() {
                this.shadowRoot.innerHTML = `
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

                        :host {
                            all: initial;
                            display: block;
                        }

                        * {
                            box-sizing: border-box;
                            margin: 0;
                            padding: 0;
                        }

                        #app-wrapper {
                            width: 600px;
                            height: 450px;
                            max-width: 100vw;
                            position: relative;
                            border: 4px solid #333;
                            font-family: 'VT323', monospace;
                            overflow: hidden;
                        }

                        #intro-screen {
                            position: absolute;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            background-color: #000;
                            z-index: 100;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            transition: opacity 1s ease;
                            cursor: default;
                        }

                        #intro-screen.fade-out {
                            opacity: 0;
                            pointer-events: none;
                        }

                        #intro-video {
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                        }

                        #btn-iniciar {
                            position: absolute;
                            right: 15%;
                            bottom: 25%;
                            font-family: 'VT323', monospace;
                            font-size: 28px;
                            color: #FFD700;
                            background: rgba(0, 0, 0, 0.7);
                            border: 2px solid #FFD700;
                            padding: 10px 20px;
                            cursor: pointer;
                            display: none;
                            animation: pulse 1.5s infinite;
                            text-shadow: 2px 2px 0 #000;
                        }

                        @keyframes pulse {
                            0% { transform: scale(1); opacity: 1; }
                            50% { transform: scale(1.1); opacity: 0.8; }
                            100% { transform: scale(1); opacity: 1; }
                        }

                        #container {
                            width: 100%;
                            height: 100%;
                            background-color: #29235E;
                            background-image: url('https://psiangelooliveira.com.br/wp-content/uploads/2026/05/fundo-game.jpg');
                            background-size: cover;
                            background-position: center;
                            color: #fff;
                            display: flex;
                            padding: 15px 25px 45px 25px; /* Subido um pouco para dar espaço aos ícones */
                            gap: 20px;
                            position: relative;
                            image-rendering: pixelated;
                        }

                        #left-panel {
                            flex: 1.2;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                        }

                        #right-panel {
                            flex: 0.8;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: stretch;
                            gap: 15px;
                        }

                        #game-list {
                            list-style: none;
                            display: flex;
                            flex-direction: column;
                            gap: 10px;
                        }

                        .game-item {
                            font-size: 20px;
                            cursor: pointer;
                            position: relative;
                            padding-left: 25px;
                            transition: color 0.1s;
                            white-space: nowrap;
                        }

                        .game-item.selected {
                            color: #AFAFD3;
                            text-shadow: 2px 2px 0 #000;
                        }

                        .game-item.selected::before {
                            content: '►';
                            position: absolute;
                            left: 0;
                            color: #AFAFD3;
                        }

                        #info-box {
                            border: 3px solid #fff;
                            background-color: #3D348B;
                            padding: 15px;
                            height: 170px; /* Caixa ajustada */
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            text-align: center;
                            font-size: 20px; /* Reduzido em 2px */
                            line-height: 1.3;
                            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
                        }

                        #controls {
                            display: flex;
                            gap: 10px;
                        }

                        .btn {
                            flex: 1;
                            background: #000;
                            color: #fff;
                            border: 3px solid #fff;
                            font-family: 'VT323', monospace;
                            font-size: 22px;
                            padding: 10px 0;
                            cursor: pointer;
                            text-transform: uppercase;
                            transition: all 0.2s;
                        }

                        .btn:hover, .btn:active {
                            background: #3D348B;
                            color: #fff;
                        }

                        #bottom-icons {
                            position: absolute;
                            bottom: 10px;
                            left: 0;
                            width: 100%;
                            display: flex;
                            justify-content: center;
                            gap: 15px;
                            z-index: 10;
                        }

                        .icon-btn {
                            background: transparent;
                            border: none;
                            color: rgba(255,255,255,0.7);
                            cursor: pointer;
                            transition: color 0.2s, transform 0.2s;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        }

                        .icon-btn:hover {
                            color: #fff;
                            transform: scale(1.1);
                        }

                        #popup-creditos {
                            display: none;
                            position: absolute;
                            bottom: 50px;
                            left: 50%;
                            transform: translateX(-50%);
                            background: #3D348B;
                            border: 2px solid #fff;
                            padding: 15px;
                            width: 80%;
                            text-align: center;
                            font-size: 18px;
                            color: #fff;
                            z-index: 20;
                            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
                        }

                    </style>

                    <div id="app-wrapper">
                        <!-- Tela de Introdução -->
                        <div id="intro-screen">
                            <video id="intro-video" src="https://psiangelooliveira.com.br/wp-content/uploads/2026/05/intro-game-agregador.mp4" autoplay muted playsinline></video>
                            <div id="btn-iniciar">INICIAR</div>
                        </div>

                        <!-- Menu Principal -->
                        <div id="container">
                            <div id="left-panel">
                                <ul id="game-list">
                                    ${this.games.map((g, i) => `
                                        <li class="game-item ${i === 0 ? 'selected' : ''}" data-index="${i}">
                                            ${g.id} - ${g.title}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div id="right-panel">
                                <div id="info-box">${this.games[0].desc}</div>
                                <div id="controls">
                                    <button class="btn" id="btn-jogar">Jogar</button>
                                    <button class="btn" id="btn-voltar">Voltar</button>
                                </div>
                            </div>
                            
                            <!-- Ícones Inferiores -->
                            <div id="bottom-icons">
                                <button class="icon-btn" id="btn-audio" title="Alternar Áudio">
                                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                </button>
                                <button class="icon-btn" id="btn-info" title="Créditos">
                                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                                </button>
                            </div>

                            <!-- Pop-up de Créditos -->
                            <div id="popup-creditos">
                                Os jogos aqui selecionados são de autoria de Neal Agarwal e os links apenas direcionam para o site original.
                            </div>
                        </div>

                        <!-- Elemento de Áudio Oculto -->
                        <audio id="bg-audio" loop src="https://psiangelooliveira.com.br/wp-content/uploads/2026/05/poker-face.mp3"></audio>
                    </div>
                `;
            }

            setupEventListeners() {
                const listItems = this.shadowRoot.querySelectorAll('.game-item');
                const infoBox = this.shadowRoot.getElementById('info-box');
                const btnJogar = this.shadowRoot.getElementById('btn-jogar');
                const btnVoltar = this.shadowRoot.getElementById('btn-voltar');
                
                const introScreen = this.shadowRoot.getElementById('intro-screen');
                const introVideo = this.shadowRoot.getElementById('intro-video');
                const btnIniciar = this.shadowRoot.getElementById('btn-iniciar');
                
                const bgAudio = this.shadowRoot.getElementById('bg-audio');
                const btnAudio = this.shadowRoot.getElementById('btn-audio');
                const btnInfo = this.shadowRoot.getElementById('btn-info');
                const popupCreditos = this.shadowRoot.getElementById('popup-creditos');
                const appWrapper = this.shadowRoot.getElementById('app-wrapper');

                let isIntroActive = true;
                let canStart = false;

                // --- Lógica da Tela de Abertura ---
                introVideo.addEventListener('ended', () => {
                    btnIniciar.style.display = 'block';
                    canStart = true;
                    introScreen.style.cursor = 'pointer';
                });

                introScreen.addEventListener('click', () => {
                    if (!canStart) return;
                    
                    introScreen.classList.add('fade-out');
                    isIntroActive = false;
                    
                    // Inicia o áudio após a interação do usuário (permitido pelos navegadores)
                    bgAudio.volume = 0.5;
                    bgAudio.play().catch(e => console.log("Áudio bloqueado:", e));
                    
                    setTimeout(() => {
                        introScreen.style.display = 'none';
                    }, 1000);
                });

                // --- Lógica do Menu ---
                const updateSelection = (index) => {
                    listItems.forEach(item => item.classList.remove('selected'));
                    listItems[index].classList.add('selected');
                    infoBox.textContent = this.games[index].desc;
                    this.currentIndex = index;
                };

                listItems.forEach((item, index) => {
                    item.addEventListener('mouseenter', () => updateSelection(index));
                    item.addEventListener('click', () => updateSelection(index));
                });

                window.addEventListener('keydown', (e) => {
                    if (isIntroActive) return;
                    
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        const newIndex = this.currentIndex > 0 ? this.currentIndex - 1 : this.games.length - 1;
                        updateSelection(newIndex);
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const newIndex = this.currentIndex < this.games.length - 1 ? this.currentIndex + 1 : 0;
                        updateSelection(newIndex);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        btnJogar.click();
                    }
                });

                btnJogar.addEventListener('click', () => {
                    bgAudio.pause(); // Para o áudio quando clica em jogar
                    window.open(this.games[this.currentIndex].url, '_blank');
                });

                btnVoltar.addEventListener('click', () => {
                    updateSelection(0);
                });

                // --- Lógica dos Ícones e Pop-up ---
                btnAudio.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (bgAudio.paused) {
                        bgAudio.play();
                        btnAudio.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
                    } else {
                        bgAudio.pause();
                        btnAudio.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>`;
                    }
                });

                btnInfo.addEventListener('click', (e) => {
                    e.stopPropagation();
                    popupCreditos.style.display = 'block';
                });

                // Qualquer clique na tela (após a intro) fecha o pop-up
                appWrapper.addEventListener('click', (e) => {
                    if (!isIntroActive && popupCreditos.style.display === 'block') {
                        popupCreditos.style.display = 'none';
                    }
                });
            }
        }

        customElements.define('retro-game-menu', RetroGameMenu);
    </script>
</body>
</html>
